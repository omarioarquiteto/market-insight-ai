services:
  - type: web
    name: market-insight-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: IQ_EMAIL
        sync: false
      - key: IQ_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: ""
      - key: BIQUOTE_CALENDAR_URL
        value: https://biquote.io/api/calendar/upcoming
      - key: IQ_ACCOUNT_TYPE
        value: PRACTICE
